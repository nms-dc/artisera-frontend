services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      API_URL: ${API_URL:-http://host.docker.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  demo:
    profiles: ["demo"]
    build:
      context: .
      args:
        NEXT_PUBLIC_USE_MOCKS: "true"
    ports:
      - "3001:3000"
